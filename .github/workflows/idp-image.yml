name: Build IDP Image

on:
  push:
    branches:
      - main
    paths:
      - 'idp/**'
      - '.github/workflows/idp-image.yml'

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY_OWNER}/platform-idp | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - name: Build and push IDP
        uses: docker/build-push-action@v6
        with:
          context: ./idp
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Update GitOps image
        run: |
          sed -i \
            "s|image: ghcr.io/acoolwolf96/platform-idp:.*|image: ${IMAGE_NAME}:${GITHUB_SHA}|" \
            gitops/idp/deployment.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/idp/deployment.yaml

          if git diff --cached --quiet; then
            echo "No image update required"
            exit 0
          fi

          git commit -m "Update IDP image to ${GITHUB_SHA::7}"
          git push
