name: Build IDP Image

on:
  push:
    branches:
      - main
    paths:
      - 'idp/**'
      - '.github/workflows/idp-image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: |
          echo "IMAGE_NAME=$(echo ghcr.io/${GITHUB_REPOSITORY_OWNER}/platform-idp | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push IDP
        uses: docker/build-push-action@v6
        with:
          context: ./idp
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
