apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-demo
  namespace: team-search
  labels:
    app: search-demo
    platform.acoolwolf.dev/team: search
    platform.acoolwolf.dev/managed-by: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search-demo
  template:
    metadata:
      labels:
        app: search-demo
        platform.acoolwolf.dev/team: search
        platform.acoolwolf.dev/managed-by: idp
    spec:
      containers:
        - name: search-demo
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: search-demo
  namespace: team-search
  labels:
    app: search-demo
    platform.acoolwolf.dev/managed-by: idp
spec:
  selector:
    app: search-demo
  ports:
    - port: 80
      targetPort: 80
