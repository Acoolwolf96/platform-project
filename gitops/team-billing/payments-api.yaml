apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-api
  namespace: team-billing
  labels:
    app: payments-api
    platform.acoolwolf.dev/team: billing
    platform.acoolwolf.dev/managed-by: idp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-api
  template:
    metadata:
      labels:
        app: payments-api
        platform.acoolwolf.dev/team: billing
        platform.acoolwolf.dev/managed-by: idp
    spec:
      containers:
        - name: payments-api
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payments-api
  namespace: team-billing
  labels:
    app: payments-api
    platform.acoolwolf.dev/managed-by: idp
spec:
  selector:
    app: payments-api
  ports:
    - port: 80
      targetPort: 80
