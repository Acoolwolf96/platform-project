apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-idp
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Acoolwolf96/platform-project.git
    targetRevision: main
    path: gitops/idp

  destination:
    server: https://kubernetes.default.svc
    namespace: platform-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
